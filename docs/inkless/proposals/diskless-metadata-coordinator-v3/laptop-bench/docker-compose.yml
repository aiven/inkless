name: dmc-bench

x-broker: &broker
  image: ${INKLESS_IMAGE:-ghcr.io/aiven/inkless:edge}
  restart: "no"
  environment: &broker-env
    CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker1:29090,2@broker2:29090,3@broker3:29090"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    KAFKA_LISTENERS: "CONTROLLER://:29090,PLAINTEXT://:9092"
    KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_DISKLESS_STORAGE_SYSTEM_ENABLE: "true"
    KAFKA_INKLESS_CONTROL_PLANE_CLASS: "io.aiven.inkless.control_plane.postgres.PostgresControlPlane"
    # Multi-host URL so the brokers follow a promoted standby in the failover scenario.
    KAFKA_INKLESS_CONTROL_PLANE_CONNECTION_STRING: "jdbc:postgresql://pg-primary:5432,pg-standby:5432/inkless?targetServerType=primary"
    KAFKA_INKLESS_CONTROL_PLANE_USERNAME: "admin"
    KAFKA_INKLESS_CONTROL_PLANE_PASSWORD: "admin"
    KAFKA_INKLESS_STORAGE_BACKEND_CLASS: "io.aiven.inkless.storage_backend.s3.S3Storage"
    KAFKA_INKLESS_STORAGE_S3_PATH_STYLE_ACCESS_ENABLED: "true"
    KAFKA_INKLESS_STORAGE_S3_BUCKET_NAME: "inkless"
    KAFKA_INKLESS_STORAGE_S3_REGION: "us-east-1"
    KAFKA_INKLESS_STORAGE_S3_ENDPOINT_URL: "http://storage:9000"
    KAFKA_INKLESS_STORAGE_AWS_ACCESS_KEY_ID: "minioadmin"
    KAFKA_INKLESS_STORAGE_AWS_SECRET_ACCESS_KEY: "minioadmin"
    KAFKA_HEAP_OPTS: "-Xmx${BROKER_HEAP:-3G} -Xms${BROKER_HEAP:-3G}"
    EXTRA_ARGS: "-javaagent:/opt/prometheus-jmx-exporter/jmx_prometheus_javaagent.jar=7070:/opt/prometheus-jmx-exporter/kafka.yml"
  volumes:
    - ../../../docker/extra/prometheus-jmx-exporter:/opt/prometheus-jmx-exporter:ro
  depends_on:
    pg-primary:
      condition: service_healthy
    create-bucket:
      condition: service_completed_successfully

x-netem: &netem
  image: nicolaka/netshoot
  cap_add: [NET_ADMIN]
  restart: "no"
  command: ["sh", "-c", "tc qdisc replace dev eth0 root netem delay ${AZ_DELAY_MS:-0.5}ms && sleep infinity"]

services:
  broker1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_RACK: "az1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker1:9092"
    volumes:
      - ../../../docker/extra/prometheus-jmx-exporter:/opt/prometheus-jmx-exporter:ro
      - broker1-data:/var/lib/kafka/data
  broker2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_BROKER_RACK: "az2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker2:9092"
    volumes:
      - ../../../docker/extra/prometheus-jmx-exporter:/opt/prometheus-jmx-exporter:ro
      - broker2-data:/var/lib/kafka/data
  broker3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_BROKER_RACK: "az3"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker3:9092"
    volumes:
      - ../../../docker/extra/prometheus-jmx-exporter:/opt/prometheus-jmx-exporter:ro
      - broker3-data:/var/lib/kafka/data

  netem-broker1: { <<: *netem, network_mode: "service:broker1", depends_on: [broker1] }
  netem-broker2: { <<: *netem, network_mode: "service:broker2", depends_on: [broker2] }
  netem-broker3: { <<: *netem, network_mode: "service:broker3", depends_on: [broker3] }
  netem-pg-primary: { <<: *netem, network_mode: "service:pg-primary", depends_on: [pg-primary] }

  # Production-like baseline: a primary with an asynchronous streaming standby.
  pg-primary:
    image: postgres:17.2
    environment:
      POSTGRES_DB: "inkless"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      -c max_connections=300
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=inkless -U admin"]
      interval: 2s
      timeout: 5s
      retries: 30

  pg-standby:
    image: postgres:17.2
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
    entrypoint: ["bash", "-c"]
    command:
      - |
        until pg_isready -h pg-primary -U admin; do sleep 1; done
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          pg_basebackup --dbname="host=pg-primary user=admin password=admin" -D "$$PGDATA" -R -X stream -C -S standby1
          chmod 700 "$$PGDATA"
        fi
        exec postgres -c shared_preload_libraries=pg_stat_statements -c shared_buffers=${PG_SHARED_BUFFERS:-2GB} -c max_connections=300
    volumes:
      - pg-standby-data:/var/lib/postgresql/data
    depends_on:
      pg-primary:
        condition: service_healthy

  storage:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    volumes:
      - minio-data:/data

  create-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    restart: "no"
    depends_on: [storage]
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://storage:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/inkless"

  # Kafka CLI tools: topic admin and kafka-producer-perf-test.
  client:
    image: ${INKLESS_IMAGE:-ghcr.io/aiven/inkless:edge}
    entrypoint: ["sleep", "infinity"]
    depends_on: [broker1, broker2, broker3]

  # Python load generator and database micro-benchmark.
  tools:
    build:
      context: .
      dockerfile: tools.Dockerfile
    working_dir: /bench
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./:/bench
      - sqlite-data:/sqlite

volumes:
  broker1-data:
  broker2-data:
  broker3-data:
  pg-primary-data:
  pg-standby-data:
  minio-data:
  sqlite-data:
