StylesPath = .vale/styles

MinAlertLevel = warning

Packages = Google, ai-tells

Vocab = Inkless

[formats]
java = md
scala = md
py = md

[*.{md,java,scala,py,lua}]
BasedOnStyles = Google, ai-tells, Inkless
TokenIgnores = [\w.+-]+@[\w-]+(?:\.[\w-]+)+
# License headers
BlockIgnores = (?s)(Copyright \(C\).*?If not\, see), (?s)(Licensed to the Apache Software Foundation.*?limitations under the License\.)

[*]
Google.Passive = warning
Google.Contractions = NO
