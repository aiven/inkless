# Workflow for Inkless ducktape system tests
name: Inkless System Tests

on:
  # Weekdays at 02:00 UTC. The 00:00 slot and the weekend belong to the `ci.yml` cron,
  # and the ducker cluster is too heavy to run alongside a full build.
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      test-target:
        description: "Ducktape test target. If empty, the full suite runs split across parallel jobs."
        required: false
        default: ""
        type: string

concurrency:
  # Keyed on the event so a scheduled run and a manual investigation on the same ref
  # don't cancel each other; repeated runs of the same kind still supersede.
  group: inkless-system-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inkless-system-tests:
    name: Inkless system tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Stays above the 300m ducker run so the inner `timeout` fires first, yielding exit 124
    # and leaving the archive and cleanup steps to run. Also 10 minutes off GitHub's 360m
    # ceiling for hosted runners, so there is no room for another bump. Both limits apply per
    # shard: if a shard outgrows them, move tests to another shard or add one.
    timeout-minutes: 350
    strategy:
      # A failing shard doesn't cancel the others, so one nightly reports every failure.
      fail-fast: false
      matrix:
        # Each shard gets its own runner, ducker cluster, Postgres, and MinIO. Together the
        # shards cover every test under `tests/kafkatest/tests/inkless/`, and the run step
        # maps each shard to its ducktape target. The split balances the shards by runtime: on
        # the 2026-11-19 nightly they took about 72, 88, and 80 minutes. A custom `test-target`
        # runs as the single `custom` shard.
        shard: ${{ fromJSON(inputs.test-target && '["custom"]' || '["switch-category-d", "switch-other", "other"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 17
          gradle-cache-read-only: true
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

      - name: Build system test libraries
        run: ./gradlew --build-cache --no-scan -PcommitId=xxxxxxxxxxxxxxxx systemTestLibs

      - name: Start ducker cluster
        run: bash tests/docker/ducker-ak up -n 11

      - name: Start Postgres and MinIO
        run: |
          docker run -d --name postgres --network ducknet --network-alias postgres \
            -e POSTGRES_DB=inkless \
            -e POSTGRES_USER=admin \
            -e POSTGRES_PASSWORD=admin \
            postgres:17.2

          until docker exec postgres pg_isready --dbname=inkless -U admin; do
            echo "waiting for postgres"
            sleep 2
          done

          docker run -d --name storage --network ducknet --network-alias storage \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data --console-address ":9001"

          docker run --rm --network ducknet --entrypoint /bin/sh pgsty/mc:RELEASE.2026-09-16T00-00-00Z -c '
            until /usr/bin/mc alias set local http://storage:9000 minioadmin minioadmin; do
              echo "waiting for minio"; sleep 2;
            done;
            /usr/bin/mc mb -p local/inkless
          '

      - name: Run inkless system tests
        id: system-tests
        env:
          SHARD: ${{ matrix.shard }}
          REQUESTED_TEST_TARGET: ${{ inputs.test-target }}
        run: |
          set +e
          suite=tests/kafkatest/tests/inkless/
          switch_test="${suite}inkless_topic_switch_test.py"
          switch_category_d="${switch_test}::InklessClassicToDisklessSwitchTest.test_fault_between_seal_commit_and_phase_2"
          # Ducktape exits non-zero when a target matches no tests, so a renamed test or file
          # fails its shard instead of passing empty.
          excludes=()
          case "$SHARD" in
            custom) targets=("$REQUESTED_TEST_TARGET") ;;
            switch-category-d) targets=("$switch_category_d") ;;
            switch-other) targets=("$switch_test"); excludes=("$switch_category_d") ;;
            other) targets=("$suite"); excludes=("$switch_test") ;;
            *) echo "Unknown shard: $SHARD"; exit 1 ;;
          esac
          ducktape_args=(--test-runner-timeout 7200000)
          if [ "${#excludes[@]}" -gt 0 ]; then
            ducktape_args+=(--exclude "${excludes[@]}")
          fi
          timeout 300m bash tests/docker/ducker-ak test "${targets[@]}" -- "${ducktape_args[@]}"
          exitcode="$?"
          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"

      - name: Archive ducktape results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkless-system-tests-results-${{ matrix.shard }}
          path: |
            results/**
            tests/results/**
            **/build/reports/**
          compression-level: 9
          if-no-files-found: ignore

      - name: Cleanup Docker
        if: always()
        run: |
          docker rm -f postgres storage || true
          bash tests/docker/ducker-ak down -f || true

      - name: Check test result
        if: always() && steps.system-tests.outputs.exitcode != '0'
        run: exit 1
